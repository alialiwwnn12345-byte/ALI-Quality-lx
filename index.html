<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع علي للدقة والجودة © 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(13, 18, 36, 0.75);
            --neon-blue: #00d2ff;
            --neon-blue-glow: rgba(0, 210, 255, 0.3);
            --accent-red: #ff2a5f;
            --accent-red-glow: rgba(255, 42, 95, 0.3);
            --text-main: #f0f4f8;
            --text-dim: #8a99ad;
            --border-color: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
                linear-gradient(to right, rgba(0,210,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,210,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px var(--neon-blue-glow);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--neon-blue-glow);
        }

        p {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--neon-blue), #0072ff);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-blue-glow);
            transition: 0.3s ease;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>موقع علي للدقة والجودة</h1>
        <p>جاهز لمعالجة الفيديوهات وتحسين الدقة بأعلى أداء</p>
        
        <button class="btn" onclick="alert('تم تفعيل النظام بنجاح!')">ابدأ الآن</button>
        
        <div class="footer">
            © 2026 جميع الحقوق محفوظة
        </div>
    </div>

</body>
</html>
